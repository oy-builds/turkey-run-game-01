<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turkey Trot — The Thanksgiving Breakout</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #2b1a12;
    display: flex; align-items: center; justify-content: center;
    font-family: "Trebuchet MS", "Segoe UI", Verdana, sans-serif;
    overflow: hidden;
  }
  #stage {
    position: relative;
    width: min(100vw, 177.78vh);
    height: min(100vh, 56.25vw);
    box-shadow: 0 0 60px rgba(0, 0, 0, 0.8);
  }
  canvas { display: block; width: 100%; height: 100%; image-rendering: auto; }
  #hint {
    position: absolute; left: 0; right: 0; bottom: 6px;
    text-align: center; color: rgba(255, 244, 214, 0.55);
    font-size: 12px; letter-spacing: 0.08em; pointer-events: none;
    text-shadow: 0 1px 2px rgba(0,0,0,0.7);
  }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="960" height="540"></canvas>
    <div id="hint">SPACE jump &nbsp;·&nbsp; DOWN duck &nbsp;·&nbsp; SHIFT dash &nbsp;·&nbsp; P pause &nbsp;·&nbsp; M mute</div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
